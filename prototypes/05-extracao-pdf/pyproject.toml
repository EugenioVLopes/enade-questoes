# PROTOTYPE (descartável) — Ticket 05: Docling vs PyMuPDF 2.1 + pdfplumber em prova real do ENADE
[project]
name = "prototype-05-extracao-pdf"
version = "0.0.1"
description = "Protótipo descartável comparando Docling vs PyMuPDF 2.1 na extração de provas e gabaritos do ENADE"
requires-python = ">=3.13,<3.14"
dependencies = [
    "docling>=2.0.0",
    "pymupdf>=1.25.0",
    "pdfplumber>=0.11.0",
    "psutil>=6.0.0",
    "torch",
    "torchvision",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
